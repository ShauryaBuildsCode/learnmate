<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /* Layout: a film slate. Left is the shot setup, right is the frame where the finished video plays. */
  :root {
    --bg: #f1efe9;
    --surface: #fbfaf7;
    --ink: #17181c;
    --muted: #6a6c74;
    --line: #d9d6cc;
    --accent: #d9480f;
    --accent-ink: #ffffff;
    --danger: #b42318;
    --stripe-a: #17181c;
    --stripe-b: #f1efe9;
    --frame: #0f1014;
    --frame-ink: #e9e7e0;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --surface: #1a1c22; --ink: #ecebe6; --muted: #9a9ca6; --line: #2c2f38;
      --accent: #ff7a3d; --accent-ink: #1a0b03; --danger: #ff8a80;
      --stripe-a: #ecebe6; --stripe-b: #121317; --frame: #08090b; --frame-ink: #e9e7e0;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
    font-size: 15px; line-height: 1.5; padding: 28px 16px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  header { display: flex; flex-direction: column; gap: 6px; }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 46px);
    line-height: 1.02; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
  }
  .sub { color: var(--muted); margin: 0; max-width: 62ch; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .slate { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
  .clapper {
    height: 22px; border-bottom: 1px solid var(--line);
    background: repeating-linear-gradient(-55deg, var(--stripe-a) 0 18px, var(--stripe-b) 18px 36px);
  }
  .slate-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  label, .lab {
    display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  textarea, select, input[type="password"], input[type="text"] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
  }
  input[type="password"], input[type="text"] { font-family: var(--font-mono); font-size: 13px; }
  textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
  textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .row3 { grid-template-columns: minmax(0, 1fr); } }
  .check {
    display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; text-transform: none;
    letter-spacing: 0; font-family: var(--font-body); font-size: 14px; color: var(--ink);
  }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .keybox { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }

  .primary {
    font: inherit; font-weight: 500; width: 100%; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 4px; padding: 12px 16px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .frame-wrap { display: flex; justify-content: center; background: var(--frame); border-radius: 4px; padding: 14px; }
  .frame {
    width: 100%; max-height: 360px; aspect-ratio: 16 / 9; border: 1px solid #2c2f38; border-radius: 2px;
    position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: var(--frame-ink); background: linear-gradient(160deg, #1c1e26, #050506);
  }
  .frame .tag {
    position: absolute; top: 8px; left: 10px; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.08em; opacity: 0.8; z-index: 1;
  }
  .frame .idle { font-size: 13px; opacity: 0.7; padding: 0 16px; text-align: center; }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .busy { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 0 16px; }
  .spinner {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #3a3d48; border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 500; }
  .error { color: var(--danger); font-size: 14px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 10px; }
  .actions a {
    flex: 1; text-align: center; padding: 9px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--ink); text-decoration: none; font-size: 14px;
  }
  .actions a:hover { border-color: var(--accent); color: var(--accent); }

  .history h2 {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; margin: 0 0 6px;
  }
  .hist-item { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist-item span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hist-item a { color: var(--accent); text-decoration: none; flex-shrink: 0; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Video Slate</h1>
    <p class="sub">Describe a shot and generate it with Seedance 2.5. Your Higgsfield key stays on the local proxy.</p>
  </header>

  <div class="grid">
    <form id="form" class="slate" aria-label="Shot setup">
      <div class="clapper"></div>
      <div class="slate-body">
        <div>
          <label for="prompt">Scene</label>
          <textarea id="prompt" required>A cinematic scene at sunset, waves rolling onto an empty beach, slow push-in</textarea>
        </div>
        <div>
          <span class="lab">Add a direction</span>
          <div class="chips" id="chips"></div>
        </div>
        <div class="row3">
          <div>
            <label for="duration">Duration</label>
            <select id="duration">
              <option value="5" selected>5 s</option>
              <option value="10">10 s</option>
            </select>
          </div>
          <div>
            <label for="resolution">Resolution</label>
            <select id="resolution">
              <option value="480p">480p</option>
              <option value="720p" selected>720p</option>
              <option value="1080p">1080p</option>
            </select>
          </div>
          <div>
            <label for="aspect">Aspect</label>
            <select id="aspect">
              <option value="16:9" selected>16:9</option>
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
              <option value="4:3">4:3</option>
              <option value="3:4">3:4</option>
              <option value="21:9">21:9</option>
            </select>
          </div>
        </div>
        <label class="check" for="audio"><input type="checkbox" id="audio" checked /><span>Generate audio</span></label>

        <button id="btn" class="primary" type="submit">Generate video</button>
      </div>
    </form>

    <section class="slate" aria-label="Preview">
      <div class="clapper"></div>
      <div class="slate-body">
        <div class="frame-wrap">
          <div class="frame" id="frame">
            <span class="tag" id="tag">16:9 / 720p</span>
            <span class="idle" id="idle">Your video plays here.</span>
            <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">Sending request.</span></div>
            <video id="player" controls loop playsinline hidden></video>
          </div>
        </div>
        <div class="meta" id="meta"></div>
        <div class="error" id="error" role="alert" hidden></div>
        <div class="actions" id="actions" hidden>
          <a id="open" href="#" target="_blank" rel="noopener">Open in new tab</a>
          <a id="download" href="#" download="video.mp4" target="_blank" rel="noopener">Download</a>
        </div>
        <div class="history" id="history" hidden>
          <h2>This session</h2>
          <div id="histList"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  var API = '/hf';
  var MODEL = 'bytedance/seedance-2.5/text-to-video';
  var POLL_MS = 4000;
  var MAX_WAIT_MS = 10 * 60 * 1000;

  var DIRECTIONS = [
    ['Slow push-in', 'slow push-in'],
    ['Handheld', 'handheld camera'],
    ['Aerial', 'aerial drone shot'],
    ['Golden hour', 'golden hour light'],
    ['Rain at night', 'rain at night, neon reflections'],
    ['Shallow focus', 'shallow depth of field'],
    ['Film grain', '35mm film grain']
  ];

  var $ = function (id) { return document.getElementById(id); };
  var sessionVideos = [];

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function renderFrame() {
    var p = $('aspect').value.split(':');
    var w = Number(p[0]), h = Number(p[1]);
    var tall = w / h < 1;
    var f = $('frame');
    f.style.aspectRatio = w + ' / ' + h;
    f.style.width = tall ? 'auto' : '100%';
    f.style.height = tall ? '360px' : 'auto';
    $('tag').textContent = $('aspect').value + ' / ' + $('resolution').value;
    $('meta').innerHTML = '';
    [['Length', $('duration').value + ' s'], ['Format', 'mp4'], ['Audio', $('audio').checked ? 'on' : 'off']].forEach(function (x) {
      var el = document.createElement('span');
      el.textContent = x[0] + ' ';
      var b = document.createElement('b');
      b.textContent = x[1];
      el.appendChild(b);
      $('meta').appendChild(el);
    });
  }

  function setBusy(busy, text) {
    $('btn').disabled = busy;
    $('busy').hidden = !busy;
    if (text) $('busyText').textContent = text;
    if (busy) {
      $('idle').hidden = true;
      $('player').hidden = true;
      $('actions').hidden = true;
      $('error').hidden = true;
    }
  }

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
    $('idle').hidden = false;
  }

  function addHistory(prompt, url) {
    sessionVideos.unshift({ prompt: prompt, url: url });
    $('history').hidden = false;
    $('histList').innerHTML = '';
    sessionVideos.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'hist-item';
      var text = document.createElement('span');
      text.textContent = item.prompt;
      var link = document.createElement('a');
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Open';
      row.appendChild(text);
      row.appendChild(link);
      $('histList').appendChild(row);
    });
  }

  function findVideoUrl(data) {
    if (data && data.video && data.video.url) return data.video.url;
    if (data && data.jobs && data.jobs[0] && data.jobs[0].results && data.jobs[0].results.raw && data.jobs[0].results.raw.url) {
      return data.jobs[0].results.raw.url;
    }
    return null;
  }

  async function api(path, options) {
    var res;
    try {
      res = await fetch(path, options);
    } catch (e) {
      throw new Error('Could not reach the local proxy. Start it with: node proxy.mjs, then open http://localhost:3000.');
    }
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var detail = data && (data.detail || data.error || data.message);
      if (res.status === 401) throw new Error('Higgsfield rejected the key (401). Check the key id and secret.');
      throw new Error('Higgsfield returned ' + res.status + (detail ? ': ' + (typeof detail === 'string' ? detail : JSON.stringify(detail)) : '.'));
    }
    return data;
  }

  async function generate(input) {
    setBusy(true, 'Sending request.');
    var submitted = await api(API + '/' + MODEL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Idempotency-Key': newId() },
      body: JSON.stringify(input)
    });
    if (!submitted || !submitted.request_id) throw new Error('Higgsfield did not return a request id.');

    var statusUrl = API + '/requests/' + submitted.request_id + '/status';
    var started = Date.now();
    var last = submitted.status || 'queued';

    while (Date.now() - started < MAX_WAIT_MS) {
      var s = await api(statusUrl, { method: 'GET' });
      last = s.status;
      if (last === 'completed') {
        var url = findVideoUrl(s);
        if (!url) throw new Error('The request finished but no video link came back.');
        return url;
      }
      if (last === 'failed') throw new Error('Generation failed' + (s.error ? ': ' + s.error : '.'));
      if (last === 'nsfw') throw new Error('The request was blocked by the content filter. Try a different scene.');
      if (last === 'canceled') throw new Error('The request was canceled.');
      var secs = Math.round((Date.now() - started) / 1000);
      setBusy(true, (last === 'in_progress' ? 'Generating' : 'Waiting in queue') + '. ' + secs + ' s elapsed.');
      await sleep(POLL_MS);
    }
    throw new Error('Timed out after 10 minutes. The request may still finish; check your Higgsfield account.');
  }

  DIRECTIONS.forEach(function (d) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = d[0];
    b.addEventListener('click', function () {
      var ta = $('prompt');
      var cur = ta.value.trim().replace(/[.,]+$/, '');
      ta.value = cur ? cur + ', ' + d[1] : d[1];
    });
    $('chips').appendChild(b);
  });

  ['duration', 'resolution', 'aspect', 'audio'].forEach(function (id) {
    $(id).addEventListener('change', renderFrame);
  });

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var prompt = $('prompt').value.trim();
    if (!prompt) return;

    var input = {
      prompt: prompt,
      duration: Number($('duration').value),
      resolution: $('resolution').value,
      aspect_ratio: $('aspect').value,
      output_format: 'mp4',
      generate_audio: $('audio').checked
    };

    try {
      var url = await generate(input);
      var p = $('player');
      p.src = url;
      p.hidden = false;
      p.play().catch(function () {});
      $('open').href = url;
      $('download').href = url;
      $('actions').hidden = false;
      addHistory(prompt, url);
    } catch (err) {
      showError(err.message);
    } finally {
      $('busy').hidden = true;
      $('btn').disabled = false;
    }
  });

  renderFrame();
</script>
</body>
</html>
